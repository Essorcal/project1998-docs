name: deploy

# Every push to main publishes site/ to GitHub Pages — no build step, the site is
# hand-authored static HTML. workflow_dispatch is there for a manual re-deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      # Optional: announce deploys to Discord. No-ops until the DISCORD_WEBHOOK secret exists
      # (create a webhook in the Discord channel settings, then `gh secret set DISCORD_WEBHOOK`).
      - name: Discord notify (optional)
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -n "$WEBHOOK" ]; then
            jq -n --arg m "$MSG" '{content: ("📜 Docs updated — " + ($m | split("\n")[0]) + "\nhttps://p1998.essorcal.com/")}' \
              | curl -sS -H 'Content-Type: application/json' -d @- "$WEBHOOK"
          fi
